# The model gateway (LiteLLM) and the tracing service (Phoenix) for the agent harness.
# `uv run agent.py smoke` and `uv run agent.py run` start them automatically with the settings in .env.
# The sandbox containers join the internal `tableqa-sandbox` network, where LiteLLM is the only reachable service.
# Only the LiteLLM container receives the Bailian API key.
name: tableqa-agent

services:
  phoenix:
    image: arizephoenix/phoenix@sha256:09ec48906c054a27dd09a88c8e6bcc24fe89649d3ecc94d3a8ed394e21279b31  # v21.1.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"  # No login needed: the port is only open on this machine (127.0.0.1).
    volumes:
      - phoenix-data:/mnt/data
    ports:
      - "127.0.0.1:6006:6006"

  litellm:
    image: ghcr.io/berriai/litellm@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9  # main-stable, pulled 2026-11-17
    # One gateway process saturated a CPU core at 128 parallel containers; 4 processes share the load.
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    volumes:
      # litellm.yaml logs full messages to Phoenix; litellm-no-messages.yaml logs only timing and tokens.
      - ./${LITELLM_CONFIG:-litellm.yaml}:/app/config.yaml:ro
    environment:
      UPSTREAM_API_BASE: ${DASHSCOPE_BASE_URL:?set it in .env}
      UPSTREAM_API_KEY: ${DASHSCOPE_API_KEY:?set it in .env}
      # Bailian calls the model qwen3.8-flash; a local test server may use another name.
      UPSTREAM_MODEL: hosted_vllm/${DASHSCOPE_MODEL:-qwen3.8-flash}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_COLLECTOR_HTTP_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: tableqa-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    networks: [default, sandbox]
    depends_on: [phoenix]

networks:
  sandbox:
    name: tableqa-sandbox
    internal: true

volumes:
  phoenix-data:
