# Same as litellm.yaml, but Phoenix receives no message text. Choose it with LITELLM_CONFIG in the env file.
# The gateway forwards calls for one model to Alibaba Cloud Bailian's OpenAI-compatible API and logs every call
# to Phoenix. Only this model name is forwarded, so code inside a sandbox cannot spend the key on another model.
# LiteLLM's `hosted_vllm` provider is a plain OpenAI-compatible client that passes Bailian's extra top-level
# fields (enable_thinking, preserve_thinking, top_k and so on) through unchanged. The same setup works with a
# local test server (vLLM, SGLang, Ollama); see docs/agent-harness.md.
model_list:
  - model_name: qwen3.8-flash
    litellm_params:
      # The name the upstream server knows the model by (compose.yaml builds it from DASHSCOPE_MODEL).
      model: os.environ/UPSTREAM_MODEL
      api_base: os.environ/UPSTREAM_API_BASE
      api_key: os.environ/UPSTREAM_API_KEY

# The gateway itself needs no key, because its port is only open on this machine and the sandbox network
# has no internet access. The Bailian key is only in this container's environment, never in a sandbox.
general_settings:
  dangerously_permit_weak_or_unset_master_key: true

litellm_settings:
  callbacks: ["arize_phoenix"]
  # Only timing, token counts and errors go to Phoenix, not the messages. Use this file for runs with many
  # parallel containers: full messages with images (1-2 MB per call) make Phoenix fall behind. The session
  # files in runs/<name>/work/<id>/session still hold every message.
  turn_off_message_logging: true
  drop_params: false
  request_timeout: 900
